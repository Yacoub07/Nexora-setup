[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexora-forge"
version = "0.1.0"
description = "Official development CLI for the NEXORA ecosystem"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "NEXORA Core Team", email = "engineering@nexora.io" }
]
keywords = ["nexora", "cli", "developer-tools", "ecosystem", "architecture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]

[project.scripts]
nexora = "nexora.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["nexora"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=nexora --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
